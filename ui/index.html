<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>SubKill</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
          <g transform="translate(20 20)">
            <path d="M 7.2 -12.5 A 14.4 14.4 0 1 1 -7.2 -12.5" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round"/>
            <line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="var(--surface)" stroke-width="6.8" stroke-linecap="round"/>
            <line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7" stroke="var(--kill)" stroke-width="3.5" stroke-linecap="round"/>
          </g>
        </svg>
        <div class="brand-text">
          <strong>SubKill</strong>
          <span>abonelik denetimi</span>
        </div>
      </div>

      <nav id="nav">
        <button data-view="panel" class="active"><span>Panel</span></button>
        <button data-view="abonelikler"><span>Abonelikler</span><em id="navCount"></em></button>
        <button data-view="takvim"><span>Takvim</span></button>
        <button data-view="tarama"><span>Tarama</span></button>
        <button data-view="ayarlar"><span>Ayarlar</span></button>
      </nav>

      <div class="sidebar-foot">
        <div class="fx" id="fxInfo">—</div>
        <button class="ghost small" id="btnRates">Kuru güncelle</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div id="viewTitle" class="view-title">Panel</div>
        <div class="topbar-actions">
          <button class="ghost" id="btnUsage">Kullanımı tara</button>
          <button class="primary" id="btnNew">Yeni abonelik</button>
        </div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
